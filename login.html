<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <h2>Admin Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="error"></p>
  </div>

<script>
function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;
  
  // Yahan apna username aur password set karein
  if(user == "admin" && pass == "gulonaqsh123") {
    window.location.href = "dashboard.html"; // Login hone ke baad kahan jana hai
  } else {
    document.getElementById("error").innerText = "Ghalat Username ya Password!";
  }
}
</script>
</body>
</html>
